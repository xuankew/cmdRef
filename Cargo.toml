[package]
name = "cmdref"
version = "0.4.0"
edition = "2021"
authors = ["xuanke"]
description = "Interactive command reference tool for Linux, macOS, Windows and testing commands"
license = "MIT"
repository = "https://github.com/xuankew/cmdRef"
keywords = ["cli", "cheatsheet", "commands", "reference", "tui"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
fuzzy-matcher = "0.3"
unicode-width = "0.2"
dirs = "5"
