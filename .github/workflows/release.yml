name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: cmdref-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: cmdref-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: cmdref-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: cmdref-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: cmdref-windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/cmdref
            target/${{ matrix.target }}/release/cmdref.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/cmdref-linux-x86_64/cmdref release/cmdref-linux-x86_64
          cp artifacts/cmdref-linux-aarch64/cmdref release/cmdref-linux-aarch64
          cp artifacts/cmdref-macos-x86_64/cmdref release/cmdref-macos-x86_64
          cp artifacts/cmdref-macos-aarch64/cmdref release/cmdref-macos-aarch64
          cp artifacts/cmdref-windows-x86_64/cmdref.exe release/cmdref.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
